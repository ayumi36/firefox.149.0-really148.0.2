name: Build Firefox 148 Termux X11

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-firefox148.yml"

permissions:
  contents: read

jobs:
  build-firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Java_* || true
          docker system prune -af || true
          df -h

      - name: Add swap for the Firefox build
        run: |
          # GitHub's runner already has a small 3 GiB swap device. Always add
          # this dedicated file unless this exact file is already active.
          if ! swapon --show=NAME --noheadings | grep -Fq /mnt/firefox-build.swap; then
            sudo fallocate -l 16G /mnt/firefox-build.swap
            sudo chmod 600 /mnt/firefox-build.swap
            sudo mkswap /mnt/firefox-build.swap
            sudo swapon /mnt/firefox-build.swap
          fi
          swapon --show
          free -h

      - name: Checkout exact Termux rollback commit
        run: |
          git clone https://github.com/termux/termux-packages.git
          cd termux-packages
          git checkout 3f062b301643941a3e1b30ee007bb3c0b67bac37

          echo "=== Firefox package recipe ==="
          grep -E '^TERMUX_PKG_VERSION=|^TERMUX_PKG_REVISION=' x11-packages/firefox/build.sh || true

      - name: Prepare Termux Docker builder
        working-directory: termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: termux-firefox148-builder:3f062b3
          CONTAINER_NAME: termux-firefox148-builder
        run: |
          # Build the builder definition from the rollback commit. The current
          # :latest image is Ubuntu 26.04, while this Firefox recipe was built
          # and tested with the commit's Ubuntu 24.04 builder.
          docker build --tag "$TERMUX_BUILDER_IMAGE_NAME" scripts
          docker buildx prune -af || true
          ./scripts/run-docker.sh true
          ./scripts/free-space.sh || true

          # Firefox 148 was released and tested with cbindgen 0.29.2. Newer
          # cbindgen releases generate incompatible enum array declarations.
          # Install it in a separate prefix and select it with Firefox's
          # supported CBINDGEN override, without changing the pinned recipe.
          ./scripts/run-docker.sh bash -lc '
            set -euo pipefail
            curl https://sh.rustup.rs -sSfo /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain 1.94.1
            . "$HOME/.cargo/env"
            cargo install --root "$HOME/.cargo-firefox148" \
              cbindgen --version 0.29.2 --locked
            "$HOME/.cargo-firefox148/bin/cbindgen" --version
          '
          df -h

      - name: Build Firefox for aarch64
        working-directory: termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: termux-firefox148-builder:3f062b3
          CONTAINER_NAME: termux-firefox148-builder
        run: |
          # The rollback commit's dependency versions have aged out of the
          # current Termux repositories. -w keeps the pinned Firefox recipe and
          # patches, but downloads current signed dependency packages instead
          # of rebuilding unrelated historical packages from stale URLs.
          ./scripts/run-docker.sh \
            env \
              CBINDGEN=/home/builder/.cargo-firefox148/bin/cbindgen \
              TERMUX_PKG_MAKE_PROCESSES=2 \
            ./build-package.sh -I -w -C -a aarch64 firefox

      - name: Collect and verify package
        run: |
          mkdir -p artifact

          find termux-packages/output -maxdepth 1 -type f \
            -name 'firefox_149.0+really148.0.2*_aarch64.deb' \
            -print > artifact/debs.txt

          DEB_COUNT="$(wc -l < artifact/debs.txt)"
          if [ "$DEB_COUNT" -ne 1 ]; then
            echo "Expected exactly one Firefox rollback .deb, found $DEB_COUNT"
            cat artifact/debs.txt
            exit 1
          fi

          DEB="$(head -n 1 artifact/debs.txt)"
          cp -v "$DEB" artifact/
          rm artifact/debs.txt

          echo "=== Collected files ==="
          ls -lh artifact/

          DEB="artifact/$(basename "$DEB")"

          echo "=== Package metadata ==="
          dpkg-deb -f "$DEB" Package Version Architecture

          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"

          test "$PACKAGE" = "firefox"

          case "$VERSION" in
            149.0+really148.0.2*) ;;
            *)
              echo "Unexpected version: $VERSION"
              exit 1
              ;;
          esac

          test "$ARCH" = "aarch64"

          (
            cd artifact
            sha256sum "$(basename "$DEB")" | tee SHA256SUMS.txt
          )

      - name: Upload Firefox 148 Termux X11 package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-148-termux-x11-aarch64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
